<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>鲨鱼桌宠 - 预览测试</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh; font-family: system-ui, sans-serif; overflow: hidden;
}
canvas { border-radius: 24px; }
.panel { display: flex; gap: 16px; margin-top: 16px;
  background: rgba(255,255,255,0.06); padding: 14px 24px; border-radius: 14px; }
.stat { color: #888; font-size: 15px; }
.stat span { color: #fff; font-weight: 700; }
.btns { display: flex; gap: 12px; margin-top: 14px; }
button { padding: 10px 20px; border-radius: 10px; border:none; cursor:pointer;
  font-size: 15px; font-weight: 600; transition: all .2s; }
button:hover { transform: scale(1.06); }
button:active { transform: scale(.96); }
.btn-feed { background: #FF6B6B; color: #fff; }
.btn-play { background: #45B7D1; color: #fff; }
.btn-pet { background: #FFD93D; color: #333; }
.toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  background:#fff; padding:12px 22px; border-radius:24px;
  font-size:28px; pointer-events:none; opacity:0;
  transition:opacity .25s; box-shadow:0 6px 24px rgba(0,0,0,.3); z-index:10; }
.toast.on { opacity:1; }
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<canvas id="c" width="300" height="360"></canvas>
<div class="panel">
  <div class="stat">🍔 <span id="hv">80</span></div>
  <div class="stat">😊 <span id="mv">90</span></div>
  <div class="stat">⚡ <span id="ev">75</span></div>
  <div class="stat">💰 <span id="cv">0</span></div>
</div>
<div class="btns">
  <button class="btn-feed" onclick="feed()">🍣 喂食</button>
  <button class="btn-play" onclick="play()">🎾 玩耍</button>
  <button class="btn-pet" onclick="pet()">✋ 摸摸</button>
</div>

<script>
const c=document.getElementById('c'),x=c.getContext('2d'),toast=document.getElementById('toast');
let T=0,state='idle',animP=0,animT=0,bubbles=[],hearts=[];
const S={hunger:80,mood:90,energy:75,coins:0};

function toastMsg(t){toast.textContent=t;toast.classList.remove('on');void toast.offsetWidth;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1400)}
function feed(){if(state==='sleep')return;if(S.coins<5){toastMsg('金币不够！');return}S.coins-=5;S.hunger=Math.min(100,S.hunger+30);S.mood=Math.min(100,S.mood+5);state='eat';animP=0;animT=0;toastMsg('🍣')}
function play(){if(state==='sleep')return;S.mood=Math.min(100,S.mood+15);S.energy=Math.max(0,S.energy-10);S.coins+=2;state='play';animP=0;animT=0;toastMsg('🎾')}
function pet(){S.mood=Math.min(100,S.mood+5);S.coins+=1;hearts.push({life:1});toastMsg('❤️')}
c.addEventListener('dblclick',play);

function hdGrad(top,mid,bot){const g=x.createLinearGradient(0,-40,0,40);g.addColorStop(0,top);g.addColorStop(.5,mid);g.addColorStop(1,bot);return g}

function draw(){
  x.clearRect(0,0,300,360);
  x.save();x.translate(150,190);

  let sc=1,rot=0;
  const fy=Math.sin(T*1.8)*4;
  if(state==='play'){rot=animP*Math.PI*4;sc=1+Math.sin(animP*Math.PI*4)*.1}
  else if(state==='eat'){sc=1+Math.sin(animP*Math.PI*3)*.06}
  x.translate(0,fy);x.scale(sc,1);x.rotate(rot);

  // === SHADOW ===
  x.fillStyle='rgba(0,0,0,.06)';x.beginPath();x.ellipse(0,116,38,12,0,0,Math.PI*2);x.fill();

  // === TAIL (behind body) ===
  let tsw=Math.sin(T*5)*.2;if(state==='walk')tsw*=1.4;
  x.save();x.translate(-10,52);x.rotate(tsw);
  x.fillStyle='#A8DFF0';
  x.beginPath();x.moveTo(0,-4);x.quadraticCurveTo(-10,-26,-22,-24);x.quadraticCurveTo(-12,-6,-4,0);x.closePath();x.fill();
  x.beginPath();x.moveTo(0,4);x.quadraticCurveTo(-10,26,-22,24);x.quadraticCurveTo(-12,6,-4,0);x.closePath();x.fill();
  x.restore();

  // === LEGS ===
  for(let s of[-1,1]){
    x.save();x.translate(s*14,86);
    if(state==='walk')x.rotate(s*Math.sin(T*8)*.15);
    x.fillStyle='#95C8DB';
    x.beginPath();x.ellipse(0,10,8,14,0,0,Math.PI*2);x.fill();
    // feet
    x.fillStyle='#85B8CC';
    x.beginPath();x.ellipse(s*3,24,10,7,0,0,Math.PI*2);x.fill();
    x.restore();
  }

  // === BODY / TORSO ===
  const bg=hdGrad('#B8E4F0','#A8DFF0','#95C8DB');
  x.fillStyle=bg;
  x.beginPath();x.ellipse(0,50,28,36,.1,0,Math.PI*2);x.fill();

  // Belly patch
  x.fillStyle='#FFFDF8';
  x.beginPath();x.ellipse(-2,54,16,20,.05,0,Math.PI*2);x.fill();

  // === ARMS ===
  for(let s of[-1,1]){
    x.save();
    x.translate(s*30,44);
    if(state==='walk')x.rotate(s*-.3+Math.sin(T*8+s)*.2);
    else if(state==='play')x.rotate(s*-.6+animP*2);
    x.fillStyle='#A8DFF0';
    // upper arm
    x.beginPath();x.ellipse(s*4,-4,8,14,-s*.15,0,Math.PI*2);x.fill();
    // hand
    x.fillStyle='#85B8CC';
    x.beginPath();x.arc(s*10,-18,5,0,Math.PI*2);x.fill();
    x.restore();
  }

  // === DORSAL FIN (on back) ===
  x.save();x.translate(-5,-8);x.rotate(Math.sin(T*3)*.05);
  x.fillStyle='#A8DFF0';
  x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(10,-18,14,-16);x.quadraticCurveTo(8,-8,4,0);x.closePath();x.fill();
  x.restore();

  // === HEAD ===
  const hg=hdGrad('#B8E4F0','#A8D8EA','#9FCFE3');
  x.fillStyle=hg;
  x.beginPath();x.ellipse(0,-36,48,44,0,0,Math.PI*2);x.fill();
  x.strokeStyle='rgba(120,190,210,.35)';x.lineWidth=1.5;x.stroke();

  // === HEAD BLUSH ===
  x.fillStyle='rgba(255,155,155,.4)';
  x.beginPath();x.ellipse(10,-24,12,7,0,0,Math.PI*2);x.fill();
  x.beginPath();x.ellipse(34,-24,12,7,0,0,Math.PI*2);x.fill();

  // === EYES ===
  const ec=state==='sleep';
  for(let s of[-1,1]){
    x.save();x.translate(22,s*10-32);
    const bx=Math.sin(T*2.5+s)*1.5;
    x.fillStyle='#FFF';
    x.beginPath();x.ellipse(bx,0,16,19,0,0,Math.PI*2);x.fill();
    if(!ec){
      const b=Math.sin(T*4+s);
      if(b>.95){x.fillStyle='#B8E4F0';x.beginPath();x.ellipse(bx,0,16,3,0,0,Math.PI*2);x.fill()}
      else{
        x.strokeStyle='rgba(100,150,170,.25)';x.lineWidth=2;
        x.beginPath();x.arc(bx,-12,14,Math.PI,0);x.stroke();
        x.fillStyle='#3D2B1F';x.beginPath();x.ellipse(bx+2,2,9,10,0,0,Math.PI*2);x.fill();
        x.fillStyle='#FFF';
        x.beginPath();x.arc(bx+4,-3,4,0,Math.PI*2);x.fill();
        x.beginPath();x.arc(bx,5,2,0,Math.PI*2);x.fill();
        x.beginPath();x.arc(bx+7,0,1.2,0,Math.PI*2);x.fill();
      }
    }else{
      x.strokeStyle='#3D2B1F';x.lineWidth=2.2;
      x.beginPath();x.arc(bx,-3,9,.3*Math.PI,.7*Math.PI);x.stroke();
    }
    x.restore();
  }

  // === SNOUT ===
  x.fillStyle=hg;
  x.beginPath();x.ellipse(50,-30,16,14,.1,0,Math.PI*2);x.fill();

  // === MOUTH ===
  const mo=state==='eat'?Math.sin(animP*Math.PI*3)*.5+.5:0;
  const mh=3+mo*9;
  x.save();x.translate(52,-28);
  if(mo>.35){
    x.fillStyle='#FF8A80';x.beginPath();x.ellipse(0,0,7,mh,0,0,Math.PI*2);x.fill();
    x.fillStyle='#FFF';
    for(let i=-1;i<=1;i++)for(let sn of[-1,1]){
      x.beginPath();x.moveTo(i*3-1.5,sn*mh*.7);x.lineTo(i*3,sn*mh*.3);x.lineTo(i*3+1.5,sn*mh*.7);x.closePath();x.fill();
    }
  }else{
    x.strokeStyle='#E07060';x.lineWidth=1.8;x.lineCap='round';
    x.beginPath();x.arc(0,-2,5,.2*Math.PI,.8*Math.PI);x.stroke();
  }
  x.restore();

  // === PARTICLES ===
  bubbles=bubbles.filter(b=>b.life>0);
  for(const b of bubbles){x.save();x.translate(b.x,b.y-(1-b.life)*35);
    x.beginPath();x.arc(0,0,b.sz*b.life,0,Math.PI*2);
    x.fillStyle=`rgba(255,255,255,${b.life*.5})`;x.fill();x.restore();b.life-=.006}
  hearts=hearts.filter(h=>h.life>0);
  for(const h of hearts){x.save();x.translate(50,-60-(1-h.life)*45);
    x.fillStyle=`rgba(255,140,140,${h.life})`;x.font=`${22*h.life}px Arial`;x.textAlign='center';
    x.fillText('❤️',0,0);x.restore();h.life-=.012}

  x.restore();
}

function loop(){
  const dt=.016;T+=dt;
  if(state==='eat'||state==='play'){animT+=dt;animP=Math.min(1,animT/1.6);if(animP>=1){state='idle';animT=0;animP=0}}
  else{
    S.hunger=Math.max(0,S.hunger-.4*dt);S.mood=Math.max(0,S.mood-.2*dt);S.energy=Math.max(0,S.energy-.12*dt);
    if(S.energy<20&&state!=='sleep')state='sleep';
    if(state==='sleep'){S.energy=Math.min(100,S.energy+1.5*dt);S.mood=Math.min(100,S.mood+.8*dt);if(S.energy>80)state='idle'}
    if(state==='idle'&&Math.random()<.004){state='walk';setTimeout(()=>{if(state==='walk')state='idle'},4000)}
    if(state==='idle'&&Math.random()<.004)bubbles.push({x:56+Math.random()*10-5,y:-32+Math.random()*10-5,sz:4+Math.random()*4,life:1})
  }
  draw();
  document.getElementById('hv').textContent=Math.round(S.hunger);
  document.getElementById('mv').textContent=Math.round(S.mood);
  document.getElementById('ev').textContent=Math.round(S.energy);
  document.getElementById('cv').textContent=Math.round(S.coins);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
